<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Fast Target Clicker</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main>
      <header>
        <h1>Fast Target Clicker</h1>
        <label class="switch" title="Enable background workflow">
          <input id="enabled" type="checkbox">
          <span></span>
        </label>
      </header>

      <label>
        指定開始時間
        <input id="startAt" type="datetime-local" step="1">
      </label>

      <p id="countdown" class="countdown" aria-live="polite">尚未開始倒數</p>

      <section class="workflow-panel">
        <h2>進階多步驟流程</h2>
        <label>
          步驟 JSON
          <textarea id="workflowSteps" spellcheck="false" rows="10" placeholder='[{"type":"click","selector":"#firstButton"}]'></textarea>
        </label>
        <label>
          從第幾步開始
          <input id="workflowStartStep" type="number" min="1" step="1" placeholder="1">
        </label>
        <div class="actions">
          <button id="sampleWorkflow" type="button">載入範例</button>
          <button id="resetWorkflow" type="button">重設進度</button>
        </div>
        <section class="workflow-status">
          <h2>流程狀態</h2>
          <p id="workflowStatus">尚未執行</p>
          <p id="workflowTarget"></p>
        </section>
      </section>

      <div class="actions main-actions">
        <button id="save" type="button">儲存設定</button>
        <button id="test" type="button">立刻測試</button>
        <button id="startCountdown" type="button">開始倒數</button>
        <button id="cancelCountdown" type="button">取消倒數</button>
        <button id="clearTime" type="button">清除時間</button>
      </div>

      <p id="status" aria-live="polite"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
