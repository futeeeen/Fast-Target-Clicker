<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Playwright Runner UI</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="hero">
        <div>
          <p class="eyebrow">Fast Target Clicker</p>
          <h1>Playwright Runner UI</h1>
          <p>用 Playwright 執行多步驟流程，可設定目標網址、JSON 步驟、起始步驟，以及秒級指定時間倒數。</p>
        </div>
        <button id="loadExample" type="button">載入練習站範例</button>
      </section>

      <section class="layout">
        <form id="runForm" class="panel">
          <label>
            目標 URL
            <input id="url" name="url" type="url" required value="https://futeeeen.github.io/Fast-Target-Clicker/practice/">
          </label>

          <div class="grid">
            <label>
              從第幾步開始
              <input id="startStep" name="startStep" type="number" min="1" value="1">
            </label>
            <label>
              slowMo 毫秒
              <input id="slowMo" name="slowMo" type="number" min="0" value="0">
            </label>
          </div>

          <label>
            指定開始時間
            <input id="startAt" name="startAt" type="datetime-local" step="1">
          </label>

          <div class="checks">
            <label class="check">
              <input id="headless" name="headless" type="checkbox">
              headless
            </label>
            <label class="check">
              <input id="closeOnFinish" name="closeOnFinish" type="checkbox">
              完成後關閉瀏覽器
            </label>
          </div>

          <label>
            Workflow JSON
            <textarea id="workflowText" name="workflowText" spellcheck="false"></textarea>
          </label>

          <div class="actions">
            <button type="submit">立刻執行</button>
            <button id="startCountdown" type="button">開始倒數</button>
            <button id="cancelCountdown" type="button">取消倒數</button>
            <button id="clearLog" type="button">清空狀態</button>
          </div>
        </form>

        <aside class="panel status-panel">
          <h2>執行狀態</h2>
          <p id="countdownText" class="countdown-text" aria-live="polite">尚未開始倒數</p>
          <p id="statusText" class="status-text">準備就緒</p>
          <div id="eventLog" class="event-log" aria-live="polite"></div>
        </aside>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
