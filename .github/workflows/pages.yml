name: Deploy product site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Build Pages site
        run: |
          mkdir -p dist
          cp -R project-site/. dist/
          mkdir -p dist/dom-js-runner
          cp -R dom-js-runner/docs/. dist/dom-js-runner/
          mkdir -p dist/playwright-runner
          cp -R playwright-runner/docs/. dist/playwright-runner/
          mkdir -p dist/practice
          cp -R dom-js-runner/docs/practice/. dist/practice/

      - name: Upload product site
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
